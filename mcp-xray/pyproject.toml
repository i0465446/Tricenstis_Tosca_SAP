[project]
name = "mcp-xray"
version = "0.1.0"
description = "Servidor MCP para integrar con Xray Cloud (Jira): importar resultados de ejecución y consultar tests/test executions"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "httpx>=0.27",
    "hyperframe>=6.0",
]

[project.scripts]
xray-mcp-server = "mcp_xray.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_xray"]
