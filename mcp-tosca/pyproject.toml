[project]
name = "mcp-tosca"
version = "0.1.0"
description = "Servidor MCP que expone herramientas para ejecutar y consultar Tricentis Tosca Commander/TBox vía CLI"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.0.0",
    "hyperframe>=6.0",
]

[project.scripts]
tosca-mcp-server = "mcp_tosca.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_tosca"]
